<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px; height: 630px; overflow: hidden;
  background: linear-gradient(135deg, #170f26 0%, #4c2fd4 60%, #170f26 100%);
  font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic Pro', 'Yu Gothic', sans-serif;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.bg-circle1 {
  position: absolute; width: 800px; height: 800px;
  border-radius: 50%; top: -300px; right: -200px;
  background: radial-gradient(circle, rgba(180,92,240,.18) 0%, transparent 70%);
}
.bg-circle2 {
  position: absolute; width: 500px; height: 500px;
  border-radius: 50%; bottom: -200px; left: -100px;
  background: radial-gradient(circle, rgba(180,92,240,.1) 0%, transparent 70%);
}
.inner {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 80px; padding: 0 80px;
}
.left { flex: 1; }
.tag {
  display: inline-block;
  background: rgba(180,92,240,.2); border: 1px solid rgba(180,92,240,.4);
  color: #d9a8f7; font-size: 13px; font-weight: 700; letter-spacing: .15em;
  padding: 6px 18px; border-radius: 100px; margin-bottom: 28px;
}
.title {
  font-size: 52px; font-weight: 900; color: #fff; line-height: 1.25;
  margin-bottom: 20px; letter-spacing: -.01em;
}
.title em { font-style: normal; color: #d9a8f7; }
.sub { font-size: 18px; color: rgba(255,255,255,.65); line-height: 1.7; max-width: 480px; }
.right { flex-shrink: 0; }
.badge-wrap { display: flex; flex-direction: column; gap: 16px; }
.badge {
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15);
  border-radius: 16px; padding: 18px 28px; text-align: center; min-width: 160px;
}
.badge-num { font-size: 36px; font-weight: 900; color: #d9a8f7; letter-spacing: -.02em; line-height: 1; margin-bottom: 6px; }
.badge-label { font-size: 13px; color: rgba(255,255,255,.55); line-height: 1.5; }
.logo { position: absolute; top: 40px; left: 80px; font-size: 22px; font-weight: 900; color: rgba(255,255,255,.9); letter-spacing: .08em; }
</style>
</head>
<body>
<div class="bg-circle1"></div>
<div class="bg-circle2"></div>
<div class="logo">MOYO Call</div>
<div class="inner">
  <div class="left">
    <div class="tag">美容室専用 AI電話自動化サービス</div>
    <div class="title">その手は、<br><em>お客様のために。</em></div>
    <div class="sub">電話対応をAIが24時間365日自動化。<br>施術中の予約取り逃がしゼロ、最短1日導入。</div>
  </div>
  <div class="right">
    <div class="badge-wrap">
      <div class="badge">
        <div class="badge-num">24h</div>
        <div class="badge-label">365日対応<br>取り逃がしゼロ</div>
      </div>
      <div class="badge">
        <div class="badge-num">即日</div>
        <div class="badge-label">工事不要<br>最短1日で開始</div>
      </div>
      <div class="badge">
        <div class="badge-num">¥5,480</div>
        <div class="badge-label">月額〜（税抜）<br>初期費用なし</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
