name: SEO Daily

# 毎日 07:10 JST（22:10 UTC）。1日1件だけ着手して PR を出す。
# 人間がマージするまで本番（callmintai.com）には出ない。
on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "何をやるか出すだけ（Claude API を叩かない）"
        type: boolean
        default: false

concurrency:
  group: seo-daily
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: 監査（現状）
        run: python3 tools/seo_audit.py | tee /tmp/audit-before.txt

      - name: 日次エージェント
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 組織レベルのキーを使う場合だけ設定する（ワークスペース発行のキーなら空でよい）
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          set -o pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node tools/seo_daily.mjs --dry-run 2>&1 | tee /tmp/seo-daily.log
          else
            node tools/seo_daily.mjs 2>&1 | tee /tmp/seo-daily.log
          fi

      - name: 画像予算チェック
        run: python3 tools/optimize-images.py --check

      - name: 監査（適用後・error があれば落とす）
        run: python3 tools/seo_audit.py --strict

      - name: 差分の有無
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "本日は変更なし。"
          fi

      - name: PR を作る
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          BRANCH="seo/daily-$DATE"

          git config user.name  "moyo-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 同じ日に2回走ったら同じブランチに積む
          if git fetch origin "$BRANCH" 2>/dev/null; then
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          {
            echo "seo: 日次更新 $DATE"
            echo
            head -c 900 seo/.pr-body.md
          } > /tmp/commit-msg.txt

          git add -A
          git commit -F /tmp/commit-msg.txt
          git push -u origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "既存 PR に追加コミットした"
            exit 0
          fi

          {
            echo "## 本日の作業"
            echo
            cat seo/.pr-body.md
            echo
            echo "## 監査 — 適用前"
            echo '```'
            head -40 /tmp/audit-before.txt
            echo '```'
            echo
            echo "## 監査 — 適用後"
            echo '```'
            python3 tools/seo_audit.py | head -40
            echo '```'
            echo
            echo "対象キーワードの正本は \`seo/keywords.json\`、判断の背景は \`seo/STRATEGY.md\`。"
            echo "内容が的外れならこの PR は閉じてよい（翌日は別の対象を選ぶ）。"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/pr-body.txt

          # PR 作成は組織の設定（Allow GitHub Actions to create and approve pull requests）に
          # 依存する。無効だとここだけ失敗するが、**ブランチは既に push 済み**なので
          # その日の作業は失われない。ジョブを落とさず、開くためのリンクを要約に出す。
          if gh pr create --base master --head "$BRANCH" \
               --title "SEO 日次更新 $DATE" --body-file /tmp/pr-body.txt; then
            echo "PR を作成した"
          else
            REPO="${GITHUB_REPOSITORY}"
            {
              echo "### PR は自動作成できなかった（ブランチは push 済み）"
              echo
              echo "組織設定の **Allow GitHub Actions to create and approve pull requests** が"
              echo "無効な可能性が高い。作業内容は \`$BRANCH\` に入っているので、下のリンクから開ける。"
              echo
              echo "https://github.com/$REPO/compare/master...$BRANCH?expand=1"
              echo
              echo "#### 本日の作業"
              cat seo/.pr-body.md
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::PR を自動作成できなかった。ブランチ $BRANCH は push 済み。ジョブ要約のリンクから開けます"
          fi

      # 失敗を黙って捨てない。2026-09-14〜09-26 は生成物が監査に落ちて
      # 13日連続で成果ゼロだったのに、誰も気づけなかった。
      - name: 失敗を Issue で知らせる
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TITLE="SEO Daily が失敗しています"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "\`$DATE\` の実行が失敗しました。**この日のSEO更新は行われていません。**"
            echo
            echo "$RUN_URL"
            echo
            echo "<details><summary>ログ（末尾40行）</summary>"
            echo
            echo '\`\`\`'
            tail -40 /tmp/seo-daily.log 2>/dev/null || echo "（ログなし。エージェント到達前に失敗）"
            echo '\`\`\`'
            echo
            echo "</details>"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/fail-body.md

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/fail-body.md
            echo "既存 Issue #$EXISTING にコメントした"
          else
            gh issue create --title "$TITLE" --body-file /tmp/fail-body.md \
              || echo "::warning::Issue を作成できなかった（権限設定を確認）"
          fi
