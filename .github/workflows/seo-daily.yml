name: SEO Daily

# 毎日 07:10 JST（22:10 UTC）。1日1件だけ着手して PR を出す。
# 人間がマージするまで本番（callmintai.com）には出ない。
on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "何をやるか出すだけ（Claude API を叩かない）"
        type: boolean
        default: false

concurrency:
  group: seo-daily
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: 監査（現状）
        run: python3 tools/seo_audit.py | tee audit-before.txt

      - name: 日次エージェント
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node tools/seo_daily.mjs --dry-run
          else
            node tools/seo_daily.mjs
          fi

      - name: 画像予算チェック
        run: python3 tools/optimize-images.py --check

      - name: 監査（適用後・error があれば落とす）
        run: python3 tools/seo_audit.py --strict

      - name: 差分の有無
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "本日は変更なし。"
          fi

      - name: PR を作る
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          BRANCH="seo/daily-$DATE"

          git config user.name  "moyo-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 同じ日に2回走ったら同じブランチに積む
          if git fetch origin "$BRANCH" 2>/dev/null; then
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          {
            echo "seo: 日次更新 $DATE"
            echo
            head -c 900 seo/.pr-body.md
          } > /tmp/commit-msg.txt

          git add -A
          git commit -F /tmp/commit-msg.txt
          git push -u origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "既存 PR に追加コミットした"
            exit 0
          fi

          {
            echo "## 本日の作業"
            echo
            cat seo/.pr-body.md
            echo
            echo "## 監査 — 適用前"
            echo '```'
            head -40 audit-before.txt
            echo '```'
            echo
            echo "## 監査 — 適用後"
            echo '```'
            python3 tools/seo_audit.py | head -40
            echo '```'
            echo
            echo "対象キーワードの正本は \`seo/keywords.json\`、判断の背景は \`seo/STRATEGY.md\`。"
            echo "内容が的外れならこの PR は閉じてよい（翌日は別の対象を選ぶ）。"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/pr-body.txt

          gh pr create --base master --head "$BRANCH" \
            --title "SEO 日次更新 $DATE" --body-file /tmp/pr-body.txt
